[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "lh-surprise-scraper"
version = "0.1.0"
description = "Lufthansa Surprise booking page analyzer (read-only, no booking)"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.47.0",
    "aiofiles>=24.1.0",
    "google-search-results",
    "aiohttp",
    "python-dotenv",
    "pytest",
    "pytest-asyncio",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-m 'not integration'"
markers = [
    "integration: real browser test, run explicitly with -m integration",
    "smoke: single-theme smoke test",
]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
